services:
  mariadb:
    image: mariadb:11
    container_name: linkpulse-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: linkpulse
      MARIADB_USER: linkpulse
      MARIADB_PASSWORD: linkpulse
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data: