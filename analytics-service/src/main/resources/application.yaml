spring:
  application:
    name: analytics-service
  datasource:
#    url: jdbc:mariadb://localhost:3306/linkpulse
    url: jdbc:postgresql://localhost:5432/linkpulse
    username: linkpulse
    password: linkpulse
  jpa:
    hibernate:
#      ddl-auto: update
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    table: flyway_history_analytics
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: io.github.gedaddict.linkpulse.common.ClickEvent
        spring.json.trusted.packages: io.github.gedaddict.linkpulse.common
        spring.json.use.type.headers: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  structured:
    format:
      console: ecs
